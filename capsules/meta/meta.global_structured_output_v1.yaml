id: meta.global_structured_output_v1
version: 1.0.0
domain: meta
title: "Global Structured Output \u2014 Summary, Details, Risks, Next Steps (v1)"
statement: "GLOBAL STRUCTURED OUTPUT (v1): A mixin capsule that promotes a simple,\n\
  consistent scaffold for non-trivial answers so they can be scanned,\nstored, and\
  \ reused easily.\n\nDefault Scaffold\n----------------\nFor complex questions, answers\
  \ SHOULD roughly follow this pattern,\nadapted as needed:\n\n- Summary:\n  - A concise,\
  \ 2\u20134 sentence overview of the answer.\n- Details:\n  - The key reasoning,\
  \ evidence, and options considered.\n- Risks / Unknowns:\n  - Main uncertainties,\
  \ failure modes, or edge cases to watch.\n- Next Steps:\n  - Concrete, actionable\
  \ follow-ups the user can take.\n\nOptional Machine-Readable Block\n-------------------------------\n\
  When useful, include a short JSON or bullet block that encodes the key\ndecision,\
  \ chosen option, and risk level in a log-friendly form."
assumptions:
- Many answers will be skimmed, stored, or revisited later.
- A small amount of consistent structure greatly improves downstream use.
pedagogy:
- kind: Socratic
  text: If the user only read the summary and next steps, would they still be helped?
- kind: Socratic
  text: "What are the top 2\u20133 risks or unknowns that deserve their own section?"
- kind: Aphorism
  text: Structure is a kindness to your future reader.
