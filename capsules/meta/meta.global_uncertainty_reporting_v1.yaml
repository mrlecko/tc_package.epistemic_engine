id: meta.global_uncertainty_reporting_v1
version: 1.0.0
domain: meta
title: "Global Uncertainty Reporting \u2014 Confidence & Revision (v1)"
statement: |-
  GLOBAL UNCERTAINTY REPORTING (v1): A mixin capsule that standardises how
  answers talk about confidence and what could change the conclusion.

  Confidence Bands
  ----------------
  Answers SHOULD, where relevant, map to one of three bands:

  - Low confidence:
    - Sparse, weak, or conflicting evidence.
    - Novel, rapidly changing, or poorly documented domain.

  - Medium confidence:
    - Some supporting evidence, but gaps remain.
    - Reasonable, but not overwhelming, agreement in sources.

  - High confidence:
    - Strong, consistent evidence or long-standing practice.
    - Domain is stable and well-understood.

  Change Conditions
  -----------------
  For important decisions, answers SHOULD briefly note:

  - What evidence or observation would most likely change the conclusion.
  - Which part of the reasoning is most fragile.
  - Whether the cost of being wrong is symmetric or skewed.
assumptions:
- Users benefit from explicit uncertainty rather than hidden confidence.
- 'Many decisions are asymmetric: being wrong in one direction is worse than the other.'
pedagogy:
- kind: Socratic
  text: Is this answer low, medium, or high confidence, and why?
- kind: Socratic
  text: What single missing piece of information would most change this recommendation?
- kind: Aphorism
  text: Confidence stated is confidence bounded.
- kind: Aphorism
  text: Tell me what would change your mind, and I know how to test you.
